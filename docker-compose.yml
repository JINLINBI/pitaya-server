services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    command:
      - /usr/local/bin/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    ports:
      - "2379:2379"

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"

  account:
    build: .
    command: ["--type", "account", "--node_id", "5"]
    environment:
      PITAYA_ETCD_ENDPOINTS: etcd:2379
      PITAYA_NATS_URL: nats://nats:4222
      DATABASE_DSN: /data/pitaya.db
      DATABASE_DRIVER: sqlite
      AUTH_JWT_SECRET: compose-dev-secret
      LUBAN_DATA_DIR: /app/data/cfg
    volumes:
      - pitaya-db:/data
    depends_on:
      - etcd
      - nats

  room:
    build: .
    command: ["--type", "room", "--node_id", "10"]
    environment:
      PITAYA_ETCD_ENDPOINTS: etcd:2379
      PITAYA_NATS_URL: nats://nats:4222
      AUTH_JWT_SECRET: compose-dev-secret
      LUBAN_DATA_DIR: /app/data/cfg
    depends_on:
      - etcd
      - nats

  connector-1:
    build: .
    command: ["--type", "connector", "--port", "3250", "--node_id", "1"]
    ports:
      - "38080:3250"
      - "18081:8008"
    environment:
      PITAYA_ETCD_ENDPOINTS: etcd:2379
      PITAYA_NATS_URL: nats://nats:4222
      AUTH_JWT_SECRET: compose-dev-secret
      LUBAN_DATA_DIR: /app/data/cfg
    depends_on:
      - etcd
      - nats
      - room
      - account

  connector-2:
    build: .
    command: ["--type", "connector", "--port", "3250", "--node_id", "2"]
    ports:
      - "38081:3250"
      - "18082:8008"
    environment:
      PITAYA_ETCD_ENDPOINTS: etcd:2379
      PITAYA_NATS_URL: nats://nats:4222
      AUTH_JWT_SECRET: compose-dev-secret
      LUBAN_DATA_DIR: /app/data/cfg
    depends_on:
      - etcd
      - nats
      - room
      - account

volumes:
  pitaya-db: